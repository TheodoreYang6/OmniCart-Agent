; 依赖方向物理防线（对齐 amap importlinter.ini —— "没有 lint 的分层 = 没有分层"）
; spec: docs/架构升级方案-借鉴amap治理与编排.md §2 P0-2
;
; 分层（上可依赖下，反向即违例）：
;   api / workflow / services / decision  —— 业务编排（≈ amap services/）
;   agents                                —— 编排消费的智能体
;   providers                             —— Provider 实现（≈ amap commons/）
;   framework                             —— 框架协议与编排器（≈ amap libs/）
;   schemas                               —— 纯契约（≈ amap schemas/api/）
; core/ 为横向基建（config/db/cache），各层可用，不入契约。
;
; 本地运行（仓库根）：
;   PYTHONPATH=backend uvx --from import-linter lint-imports --config importlinter.ini
[importlinter]
root_packages =
    app

[importlinter:contract:1]
name = framework 对业务不可见（对齐 amap "libs-invisible-to-services"）
type = forbidden
source_modules =
    app.framework
forbidden_modules =
    app.api
    app.workflow
    app.services
    app.decision
    app.agents
    app.providers

[importlinter:contract:2]
name = schemas 纯契约（零业务 import）
type = forbidden
source_modules =
    app.schemas
forbidden_modules =
    app.api
    app.workflow
    app.services
    app.decision
    app.agents
    app.providers
    app.framework
    app.repositories
    app.retrieval
    app.model_gateway

[importlinter:contract:3]
name = providers 不得反向依赖编排层（P0-1 违例修复后立法防回潮）
type = forbidden
source_modules =
    app.providers
forbidden_modules =
    app.api
    app.workflow
