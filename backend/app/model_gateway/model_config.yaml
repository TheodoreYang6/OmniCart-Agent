# ============================================================
# OmniCart Agent 模型统一配置
# 业务代码只通过"能力名"调用，不关心具体模型
# 修改模型只需改此文件，不动业务代码
# ============================================================

# API 提供商 (实际值从 .env 读取，此处为默认值)
# deepseek* 模型名由 qwen_chat.py 自动路由到 DEEPSEEK_BASE_URL/KEY
provider:
  qwen:
    api_key: "${QWEN_API_KEY}"
    base_url: "https://dashscope.aliyuncs.com/api/v1"
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com/v1"

# 能力 → 模型映射
capabilities:

  # ---- 文本生成类 ----
  # 2026-07-31：Qwen 账户余额耗尽，文本类能力切 DeepSeek；余额恢复后改回即可
  chat_generation:          # 多轮对话、推荐解释、最终回答
    model: deepseek-v4-flash
    temperature: 0.7
    max_tokens: 2048

  intent_understanding:     # 购物意图、约束抽取
    model: deepseek-v4-flash
    temperature: 0.3
    max_tokens: 1024

  tool_calling:             # LLM 函数调用（工具选择 + 参数填充，OpenAI tools 协议）
    model: deepseek-v4-flash
    temperature: 0.1
    max_tokens: 512

  planning:                 # LLM Planner（执行计划编排，封闭能力词表 JSON 输出）
    model: deepseek-v4-flash
    temperature: 0.1
    max_tokens: 1024

  # ---- 视觉理解类 ----
  visual_understanding:     # 商品图/截图解析
    model: qwen-vl-plus
    temperature: 0.3
    max_tokens: 2048

  # ---- 向量化类 ----
  text_embedding:           # 商品文本、评论、FAQ 向量化
    model: qwen3.7-text-embedding
    dimensions: 1024

  vision_embedding:         # 商品图片向量化 (V1-Plus 启用)
    model: qwen3-vl-embedding
    dimensions: 1024
    fallback: text_embedding

  # ---- 上下文压缩 ----
  context_compression:      # 对话历史增量摘要 (小模型，低延迟，异步)
    model: deepseek-v4-flash
    temperature: 0.3
    max_tokens: 256

  # ---- 精排类 ----
  text_reranking:           # 候选商品文本精排
    model: gte-rerank-v2

  vision_reranking:         # 图文精排 (V1-Plus 启用)
    model: qwen3-vl-rerank
    fallback: text_reranking

# 全局开关
mock_mode: ${OMNICART_MOCK_MODE}
