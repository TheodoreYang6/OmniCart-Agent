# OmniCart Agent — Workflow 架构参考文档
# 此文件用于文档说明工作流结构，不做运行时解析。
# 实际工作流定义在 graph.py 的 build_workflow() 中（Python 代码是唯一真相源）。
# 若修改 graph.py 中的节点/边/条件分支，请同步更新此文件以保持文档准确。

name: omnicart-shopping-decision
version: "1.1"
description: 多模态购物决策工作流 — Router → Visual → Rrieval → Reranker → Evidence Check → Decision → Response → Guard

nodes:
  router:
    agent: Router Agent
    description: 意图识别 + 约束抽取 + 检索计划（规则优先 + LLM 增强）
  visual:
    agent: Visual Agent
    description: Qwen-VL 商品截图解析
    optional: true
    fallback: skip_if_no_image
  retrieval:
    agent: Retrieval Agent
    description: 多路证据检索 (text/review/policy) — 三通道并行
  reranker:
    agent: Qwen Reranker
    description: 语义精排（失败时保持原序）
    fallback: keep_original_order
  evidence_check:
    agent: Evidence Sufficiency Checker
    description: 证据充足性检查 — 按意图类型检查最少证据类型
    required:
      recommend: [text_retrieval, review_positive]
      risk_check: [review_risk]
      compare: [text_retrieval, review_positive]
      compatibility_check: [policy_faq]
      alternative: [text_retrieval]
  decision:
    agent: Decision Agent
    description: 约束求解 + 7 维评分排序
  response:
    agent: Response Agent
    description: Context Compiler + LLM 回答
  guard:
    agent: Response Guard
    description: 回答守门验证（5 项）

edges:
  - from: router
    to: visual
    condition: has_image
  - from: router
    to: retrieval
    condition: default
  - from: visual
    to: retrieval
  - from: retrieval
    to: reranker
  - from: reranker
    to: evidence_check
  - from: evidence_check
    to: decision
    condition: has_results
  - from: evidence_check
    to: response
    condition: empty_results
  - from: decision
    to: response
  - from: response
    to: guard
  - from: guard
    to: END

retrieval:
  channels:
    - text
    - review
    - policy
  default_top_k: 5
  compare_top_k: 10

scoring:
  weights:
    budget_fit: 0.22
    scenario_fit: 0.24
    spec_match: 0.20
    review_confidence: 0.14
    visual_similarity: 0.10
    availability_score: 0.10
    risk_penalty: 0.15

guard:
  checks:
    - evidence_bound
    - price_accurate
    - risk_warned
    - honest_on_empty
    - schema_valid

fallback:
  visual_agent:
    on_error: skip
    on_low_confidence: continue_with_text_only
  reranker:
    on_error: keep_original_order
  evidence_check:
    on_insufficient: flag_in_report

memory:
  enabled: true
  backend: in-memory
  ttl_seconds: 3600

checkpoint:
  enabled: true
  backend: json_file
  directory: data/checkpoints/
