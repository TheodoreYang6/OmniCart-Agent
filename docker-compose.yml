services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnicart
      POSTGRES_PASSWORD: omnicart
      POSTGRES_DB: omnicart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicart"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/api/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
    volumes:
      - ./data:/app/data
      - ./ecommerce_agent_dataset:/app/ecommerce_agent_dataset:ro
      - ./backend/data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Web 前端：静态资源 + /api、/images 反代到 backend（单栈同源部署）
  web:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    environment:
      OMNICART_PROXY_TARGET: ${OMNICART_WEB_PROXY_TARGET:-backend:8006}
    ports:
      - "${OMNICART_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_storage:
  redis_data:
