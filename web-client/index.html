<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 浏览器图标采用深色欧米标；应用内 Logo 会随明暗主题切换。 -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#256BFF" />
    <meta name="description" content="OmniCart Agent — 多模态购物智能体，欧米陪你探索未来购物新范式。" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: http://127.0.0.1:8006 http://localhost:8006; media-src 'self' blob: http://127.0.0.1:8006 http://localhost:8006; connect-src 'self' ws: http://127.0.0.1:8006 http://localhost:8006; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:" />
    <title>OmniCart · 欧米购物智能体</title>
    <!-- 防闪白：首帧绘制前先把主题写到 <html>，避免深色用户看到白屏闪烁 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('omnicart-theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
